<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden Planner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">Garden Planner</span>
  <div class="group" id="modeGroup">
    <button type="button" data-mode="select" class="mode active" title="Select / move / resize objects (V)">Select</button>
    <button type="button" data-mode="garden" class="mode" title="Draw the garden polygon (G)">Garden</button>
    <button type="button" data-mode="paint" class="mode" title="Paint tiles grass or stone (P)">Paint</button>
    <button type="button" data-mode="rect" class="mode" title="Add a rectangle (R)">Rect</button>
    <button type="button" data-mode="square" class="mode" title="Add a square (S)">Square</button>
    <button type="button" data-mode="circle" class="mode" title="Add a circle (C)">Circle</button>
  </div>
  <div class="group" id="paintGroup" style="display:none">
    <label><input type="radio" name="paint" value="grass" checked> Grass</label>
    <label><input type="radio" name="paint" value="stone"> Stone</label>
  </div>
  <div class="group">
    <label title="Show or hide measurements on garden and object edges"><input type="checkbox" id="toggleDims" checked> Dimensions</label>
  </div>
  <div class="group">
    <button type="button" id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button type="button" id="zoomOut" title="Zoom out">&#8722;</button>
    <span id="zoomLabel">100%</span>
    <button type="button" id="zoomIn" title="Zoom in">+</button>
    <button type="button" id="zoomReset" title="Reset view">Reset</button>
  </div>
  <div class="group">
    <button type="button" id="btnSave" title="Save to browser storage">Save</button>
    <button type="button" id="btnLoad" title="Load from browser storage">Load</button>
    <button type="button" id="btnExport" title="Download plan as JSON">Export JSON</button>
    <button type="button" id="btnImport" title="Load plan from a JSON file">Import JSON</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button type="button" id="btnPng" title="Download a PNG image of the plan">Export PNG</button>
  </div>
</header>
<div id="main">
  <aside id="panel">
    <section>
      <h2>Garden</h2>
      <div class="row">
        <label>Tile size (cm)
          <input id="tileSize" type="number" min="1" step="1" value="30">
        </label>
        <button type="button" id="btnApplyTile">Apply</button>
      </div>
      <div class="row">
        <button type="button" id="btnDrawGarden">Redraw polygon</button>
        <button type="button" id="btnFinishPolygon">Finish polygon</button>
        <button type="button" id="btnClearPolygon">Clear garden</button>
      </div>
      <div class="row">
        <button type="button" id="btnFillGrass">All grass</button>
        <button type="button" id="btnFillStone">All stone</button>
        <button type="button" id="btnClearTiles">Clear tiles</button>
      </div>
      <p class="hint" id="gardenStatus"></p>
    </section>
    <section>
      <h2>Objects</h2>
      <ul id="objectList"></ul>
      <div id="objectEditor" hidden>
        <div class="row"><label>Label
          <input id="objLabel" type="text" placeholder="e.g. Wooden bench">
        </label></div>
        <div class="row"><label>Colour
          <input id="objColor" type="color" value="#c98f4e">
        </label></div>
        <div class="row"><label>Description (shown on hover)
          <textarea id="objDesc" rows="3" placeholder="Free text, e.g. seats 4, bought 2024"></textarea>
        </label></div>
        <div class="row" id="geomRow"></div>
        <div class="row">
          <button type="button" id="btnDeleteObj">Delete object</button>
        </div>
      </div>
      <p class="hint" id="objHint">Add an object with the Rect / Square / Circle tools, then select it to edit its label, colour and description. Hover any object on the canvas to see its label and description.</p>
    </section>
  </aside>
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="tooltip" hidden></div>
    <div id="contextBar" hidden>
      <button type="button" id="ctxRotLeft" title="Rotate -15 degrees (hold Shift while dragging the rotate handle to snap to 15 degrees)">&#10226; 15&deg;</button>
      <button type="button" id="ctxRotRight" title="Rotate +15 degrees">&#10227; 15&deg;</button>
      <button type="button" id="ctxDuplicate" title="Duplicate object">&#10697;</button>
      <button type="button" id="ctxDelete" title="Delete object">&#10005;</button>
    </div>
  </div>
</div>
<script src="garden-core.js"></script>
<script src="app.js"></script>
</body>
</html>
